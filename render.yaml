# Lets Render create the website and database from this one file (New > Blueprint).
databases:
  - name: meeple-db
    plan: free
services:
  - type: web
    name: meeple-shelf
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meeple-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SOURCE
        value: mock          # fake games for testing; delete this line when your BGG token is ready
      - key: MOCK_MAX_ID
        value: "6"           # raise to 10 to "release" 4 new fake games
      - key: ADMIN_EMAIL
        sync: false          # you type this in: the email you'll sign up with
      - key: BGG_TOKEN
        sync: false          # leave blank until BGG approves you
